<div class="login-shell">
    <div class="background" aria-hidden="true">
        <div class="grid-lines"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <section class="container">
        <div class="card">
            <header class="brand">
                <div class="brand-mark">
                    <span class="brand-line"></span>
                    <span class="brand-icon">◈</span>
                    <span class="brand-line"></span>
                </div>
                <h1 class="brand-name">Accedi</h1>
                <p class="brand-sub">Bentornato. Inserisci le tue credenziali.</p>
            </header>

            <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                <div class="field-group">
                    <div class="field" [class.field-invalid]="isInvalid('username')">
                        <label for="username" class="field-label">Username</label>
                        <div class="field-wrap">
                            <input
                                id="username"
                                class="field-input"
                                type="text"
                                formControlName="username"
                                placeholder="il tuo username"
                                autocomplete="username"
                            />
                            <span class="field-border"></span>
                        </div>
                    </div>

                    <div class="field" [class.field-invalid]="isInvalid('password')">
                        <label for="password" class="field-label">Password</label>
                        <div class="field-wrap">
                            <input
                                id="password"
                                class="field-input"
                                [type]="hidePassword ? 'password' : 'text'"
                                formControlName="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                            />
                            <span class="field-border"></span>
                            <button
                                type="button"
                                class="toggle-pw"
                                (click)="togglePasswordVisibility()"
                                [attr.aria-label]="hidePassword ? 'Mostra password' : 'Nascondi password'"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                                    <circle cx="12" cy="12" r="3" />
                                    <path *ngIf="!hidePassword" d="M4 20 20 4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <p class="error-msg" *ngIf="loginError">Credenziali non valide. Riprova.</p>

                <button type="submit" class="submit-btn" [disabled]="loading">
                    <span class="btn-text">{{ loading ? 'Accesso...' : 'Entra' }}</span>
                    <span class="btn-arrow" aria-hidden="true">→</span>
                </button>
            </form>

            <p class="footer-note">Sistema protetto · accesso riservato</p>
        </div>
    </section>
</div>
